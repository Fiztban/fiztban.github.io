# GitHub Pages build settings.
#
# The site is plain hand-written HTML. Jekyll runs here whether or not this file
# exists, and passes those files through untouched, so this config exists only to
# say what should NOT be published.
#
# The distinction that matters: excluded here means "in the repository but not on
# the web server". That is different from .gitignore, which means "not in the
# repository at all". Working code belongs in git so it is versioned and backed
# up; it does not follow that it belongs on kinderminds.nz.

exclude:
  # The consent prototype IS served, so families and staff can be shown the two
  # views side by side: combined-consent-cards.html and combined-consent.html,
  # their CSS and JS, and the form snapshot they render from. Both pages carry
  # noindex/no-referrer, nothing links to them, and neither can submit.
  #
  # Everything else under forms/ stays in git and off the web: the handover
  # notes and the spec, the drift-check and single-file tooling, the test suite,
  # the npm manifests, and the intake prototype, which is not part of what is
  # being shown and is not finished.
  - forms/HANDOVER.md
  - forms/README.md
  - forms/build-single-file.py
  - forms/capture-form.mjs
  - forms/consent.test.js
  - forms/consent-cards.test.js
  - forms/intake-cards.test.js
  - forms/intake-cards.html
  - forms/intake-cards.css
  - forms/intake-cards.js
  - forms/zanda-patient-intake.json
  - forms/package.json
  - forms/package-lock.json

  # Developer notes, not site content.
  - CLAUDE.md
  - README.md
  - Reference.url

# Anything beginning with an underscore is excluded by Jekyll already, which is
# why _build (the guide page sources and the assembler) is not published either.
